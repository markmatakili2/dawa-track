<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Dawa Track</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="db.js"></script>
</head>

<body>
    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo"><span class="dot"></span>Dawa Track</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="surplus.html">Surplus stock</a>
                <a href="login.html">Login</a>
            </div>
            <a href="admin-login.html" class="btn btn-primary">Admin</a>
        </nav>
    </header>

    <main class="page">
        <section class="form-card" style="margin: 40px auto 0; max-width: 520px;">
            <h2 class="section-title">Admin login</h2>
            <p class="section-subtitle">Use the administrator account to approve listings and review requests.</p>
            <form id="adminLoginForm" class="form-grid">
                <label>
                    Email address
                    <input type="email" id="adminEmail" name="email" value="admin@dawatrack.org" required />
                </label>
                <label>
                    Password
                    <input type="password" id="adminPassword" name="password" value="admin1234" required />
                </label>
                <div id="adminError" class="demo-note hidden" style="color: var(--red);"></div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Log in</button>
                    <a href="login.html" class="btn btn-outline">Facility login</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div>
                <strong>Dawa Track</strong>
                <p>Admin access is client-side only for this static demo.</p>
            </div>
            <div>
                <a href="index.html">Home</a><br />
                <a href="about.html">About</a><br />
                <a href="surplus.html">List surplus stock</a><br />
                <a href="login.html">Facility login</a><br />
                <a href="admin-login.html">Admin</a>
            </div>
        </div>
    </footer>

    <script>
        const adminLoginForm = document.getElementById('adminLoginForm');
        const adminError = document.getElementById('adminError');

        adminLoginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            if (email === 'admin@dawatrack.org' && password === 'admin1234') {
                sessionStorage.setItem('dawaAdminAuth', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                adminError.textContent = 'Invalid admin credentials. Please try again.';
                adminError.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
