<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dawa Track Admin</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="db.js"></script>
    <style>
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px max(16px, calc((100% - 1072px) / 2));
            background: var(--surface);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
        }

        .tagline {
            font-size: 13px;
            color: var(--muted);
        }

        .logout-btn {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            border-radius: 6px;
            padding: 9px 16px;
            min-height: 44px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .shell {
            display: flex;
            min-height: calc(100vh - 72px);
        }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--line);
            padding: 24px 0;
        }

        .nav-item {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        .nav-item.active {
            color: var(--primary-dark);
            background: var(--primary-tint);
            border-left-color: var(--primary);
        }

        .main {
            flex: 1;
            padding: 28px;
            background: var(--bg);
            max-width: 100%;
            min-width: 0;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .section-header h1 {
            font-size: 28px;
            margin: 0;
        }

        .card-list {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .card {
            overflow-x: auto;
        }

        .table-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .wide-table {
            width: 100%;
            min-width: 760px;
            border-collapse: collapse;
            margin-top: 12px;
        }

        .wide-table th,
        .wide-table td {
            border-bottom: 1px solid var(--line);
            padding: 12px 10px;
            text-align: left;
            vertical-align: top;
        }

        .wide-table th {
            font-size: 12px;
            color: #435062;
            text-transform: uppercase;
        }

        .tab-panel {
            margin-top: 12px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.new {
            background: var(--warning-tint);
            color: var(--warning-ink);
        }

        .badge.contacted {
            background: var(--primary-tint);
            color: var(--primary-dark);
        }

        .badge.resolved {
            background: var(--success-tint);
            color: var(--success-ink);
        }

        .badge.approved {
            background: var(--success-tint);
            color: var(--success-ink);
        }

        .badge.pending {
            background: var(--warning-tint);
            color: var(--warning-ink);
        }

        .badge.rejected {
            background: var(--danger-tint);
            color: var(--danger);
        }

        .status-banner {
            margin: 18px 28px 0;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }

        .status-banner.visible {
            display: block;
        }

        .status-banner.success {
            background: var(--success-tint);
            color: var(--success-ink);
            border: 1px solid var(--line);
        }

        .status-banner.error {
            background: var(--danger-tint);
            color: var(--danger);
            border: 1px solid var(--line);
        }

        .form-grid {
            display: grid;
            gap: 16px;
        }

        .form-grid.small {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: 600;
            color: var(--muted);
            font-size: 13px;
        }

        input,
        select,
        textarea {
            min-height: 44px;
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font: inherit;
            width: 100%;
            background: var(--surface);
            color: var(--ink);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .small-note {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 900px) {
            .shell {
                flex-direction: column;
            }

            .sidebar {
                display: flex;
                width: 100%;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid var(--line);
                padding: 8px 0;
            }

            .nav-item {
                flex: 0 0 auto;
                padding: 10px 16px;
            }

            .card-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .main {
                padding: 20px 16px;
            }

            .card-list,
            .form-grid.small {
                grid-template-columns: 1fr;
            }

            .grid-span-two {
                grid-column: 1 / -1;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions .btn {
                width: 100%;
            }
        }

        .admin-login-card {
            max-width: 520px;
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="brand">
            <h1 class="page-title">Dawa Track Admin</h1>
            <p class="tagline">Review facilities, approve listings, and manage transfer requests.</p>
        </div>
        <button class="logout-btn" id="logoutButton">Log out</button>
    </div>

    <div id="adminStatus" class="status-banner" role="status" aria-live="polite"></div>

    <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main" id="main"></main>
    </div>

    <script>
        (async function () {
            const tabs = [
                { id: 'overview', label: 'Overview' },
                { id: 'facilities', label: 'Facilities' },
                { id: 'medicine', label: 'Medicine Listings' },
                { id: 'requests', label: 'Transfer Requests' },
            ];

            let activeTab = 'overview';

            function setStatus(message, tone = 'info') {
                const status = document.getElementById('adminStatus');
                status.textContent = message || '';
                status.className = `status-banner ${tone === 'error' ? 'error' : tone === 'success' ? 'success' : ''} ${message ? 'visible' : ''}`.trim();
            }

            function renderSidebar() {
                const sidebar = document.getElementById('sidebar');
                sidebar.innerHTML = tabs
                    .map((tab) => `<div class="nav-item${tab.id === activeTab ? ' active' : ''}" data-tab="${tab.id}">${tab.label}</div>`)
                    .join('');

                sidebar.querySelectorAll('.nav-item').forEach((item) => {
                    item.addEventListener('click', () => {
                        activeTab = item.dataset.tab;
                        renderMain();
                    });
                });
            }

            async function fetchDashboardData() {
                const [facilities, medicines, transferRequests] = await Promise.all([
                    DawaDB.getFacilities(),
                    DawaDB.getAllMedicines(),
                    DawaDB.getTransferRequests(),
                ]);

                return { facilities, medicines, transferRequests };
            }

            async function renderMain() {
                renderSidebar();
                const main = document.getElementById('main');

                try {
                    const data = await fetchDashboardData();
                    const approvedCount = data.medicines.filter((item) => item.approval === 'approved').length;
                    const pendingCount = data.medicines.filter((item) => item.approval === 'pending').length;
                    const openRequests = data.transferRequests.filter((request) => request.status !== 'resolved').length;

                    if (activeTab === 'overview') {
                        main.innerHTML = `
                        <div class="section-header">
                            <div>
                                <h1>Overview</h1>
                                <p class="small-note">Live counts from the connected Supabase database.</p>
                            </div>
                        </div>
                        <div class="card-list">
                            <div class="metric-card">
                                <div class="metric-label">Facilities</div>
                                <div class="metric-value">${data.facilities.length}</div>
                                <p>Registered facilities in the system.</p>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label">Approved listings</div>
                                <div class="metric-value">${approvedCount}</div>
                                <p>Medicine listings visible on the home page.</p>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label">Pending approvals</div>
                                <div class="metric-value">${pendingCount}</div>
                                <p>Surplus listings waiting for admin review.</p>
                            </div>
                            <div class="metric-card">
                                <div class="metric-label">Open requests</div>
                                <div class="metric-value">${openRequests}</div>
                                <p>Transfer requests that still need processing.</p>
                            </div>
                        </div>
                        `;
                    }

                    if (activeTab === 'facilities') {
                        main.innerHTML = `
                        <div class="section-header">
                            <div>
                                <h1>Facilities</h1>
                                <p class="small-note">Manage registered facilities and add new partners.</p>
                            </div>
                        </div>
                        <div class="card">
                            <table class="wide-table">
                                <thead>
                                    <tr><th>Name</th><th>County</th><th>Contact person</th><th>Phone</th><th>Email</th><th>Action</th></tr>
                                </thead>
                                <tbody>
                                    ${data.facilities
                                        .map((facility) => `
                                            <tr>
                                                <td>${facility.name}</td>
                                                <td>${facility.county || '-'}</td>
                                                <td>${facility.contactPerson || '-'}</td>
                                                <td>${facility.phone ? `<a href="tel:${facility.phone}">${facility.phone}</a>` : '-'}</td>
                                                <td>${facility.email ? `<a href="mailto:${facility.email}">${facility.email}</a>` : '-'}</td>
                                                <td><button class="btn btn-outline remove-facility" data-id="${facility.id}">Remove</button></td>
                                            </tr>
                                        `)
                                        .join('')}
                                </tbody>
                            </table>
                        </div>
                        <div class="card">
                            <h3>Add facility</h3>
                            <form id="facilityForm" class="form-grid small">
                                <label class="field">
                                    Name
                                    <input name="name" required />
                                </label>
                                <label class="field">
                                    County
                                    <input name="county" />
                                </label>
                                <label class="field">
                                    Contact person
                                    <input name="contactPerson" />
                                </label>
                                <label class="field">
                                    Phone
                                    <input name="phone" type="tel" />
                                </label>
                                <label class="field">
                                    Email
                                    <input name="email" type="email" />
                                </label>
                                <div class="form-actions grid-span-two">
                                    <button type="submit" class="btn btn-primary">Add facility</button>
                                </div>
                            </form>
                        </div>
                        `;

                        document.getElementById('facilityForm').addEventListener('submit', async (event) => {
                            event.preventDefault();
                            const formData = new FormData(event.target);
                            const payload = {
                                name: formData.get('name'),
                                county: formData.get('county'),
                                contactPerson: formData.get('contactPerson'),
                                phone: formData.get('phone'),
                                email: formData.get('email'),
                            };

                            try {
                                await DawaDB.addFacility(payload);
                                event.target.reset();
                                setStatus('Facility added.', 'success');
                                await renderMain();
                            } catch (error) {
                                setStatus(error?.message || 'Unable to add the facility.', 'error');
                            }
                        });

                        document.querySelectorAll('.remove-facility').forEach((button) => {
                            button.addEventListener('click', async () => {
                                try {
                                    await DawaDB.removeFacility(button.dataset.id);
                                    setStatus('Facility removed.', 'success');
                                    await renderMain();
                                } catch (error) {
                                    setStatus(error?.message || 'Unable to remove the facility.', 'error');
                                }
                            });
                        });
                    }

                    if (activeTab === 'medicine') {
                        main.innerHTML = `
                        <div class="section-header">
                            <div>
                                <h1>Medicine Listings</h1>
                                <p class="small-note">Approve pending stock and manage active listings.</p>
                            </div>
                        </div>
                        <div class="card">
                            <table class="wide-table">
                                <thead>
                                    <tr><th>Drug</th><th>Qty</th><th>Facility</th><th>Expiry</th><th>Status</th><th>Action</th></tr>
                                </thead>
                                <tbody>
                                    ${data.medicines
                                        .map((item) => {
                                            const actions = item.approval === 'pending'
                                                ? `<button class="btn btn-primary approve-listing" data-id="${item.id}">Approve</button> <button class="btn btn-outline reject-listing" data-id="${item.id}">Reject</button>`
                                                : `<button class="btn btn-outline remove-listing" data-id="${item.id}">Remove</button>`;
                                            return `
                                                <tr>
                                                    <td>${item.drug}</td>
                                                    <td>${item.quantityLabel || `${Number(item.quantity).toLocaleString('en-KE')} ${item.unit || 'units'}`}</td>
                                                    <td>${item.facility}</td>
                                                    <td>${item.expiry}</td>
                                                    <td><span class="badge ${item.approval === 'approved' ? 'approved' : item.approval === 'rejected' ? 'rejected' : 'pending'}">${item.approval === 'approved' ? 'Approved' : item.approval === 'rejected' ? 'Rejected' : 'Pending'}</span></td>
                                                    <td>${actions}</td>
                                                </tr>
                                            `;
                                        })
                                        .join('')}
                                </tbody>
                            </table>
                        </div>
                        <div class="card">
                            <h3>Add listing</h3>
                            <form id="medicineForm" class="form-grid small">
                                <label class="field">
                                    Drug name
                                    <input name="drug" required />
                                </label>
                                <label class="field">
                                    Quantity
                                    <input name="quantity" type="number" required />
                                </label>
                                <label class="field">
                                    Facility
                                    <input name="facility" required />
                                </label>
                                <label class="field">
                                    Expiry
                                    <input name="expiry" type="date" required />
                                </label>
                                <label class="field">
                                    Status
                                    <select name="status">
                                        <option value="ready">Ready</option>
                                        <option value="monitor">Monitor</option>
                                    </select>
                                </label>
                                <div class="form-actions grid-span-two">
                                    <button type="submit" class="btn btn-primary">Add approved listing</button>
                                </div>
                            </form>
                        </div>
                        `;

                        document.getElementById('medicineForm').addEventListener('submit', async (event) => {
                            event.preventDefault();
                            const formData = new FormData(event.target);
                            const payload = {
                                drug: formData.get('drug'),
                                quantity: formData.get('quantity'),
                                facility: formData.get('facility'),
                                expiry: formData.get('expiry'),
                                status: formData.get('status'),
                            };

                            try {
                                await DawaDB.adminAddMedicine(payload);
                                event.target.reset();
                                setStatus('Listing added.', 'success');
                                await renderMain();
                            } catch (error) {
                                setStatus(error?.message || 'Unable to add the listing.', 'error');
                            }
                        });

                        document.querySelectorAll('.approve-listing').forEach((button) => {
                            button.addEventListener('click', async () => {
                                try {
                                    await DawaDB.approveMedicine(button.dataset.id);
                                    setStatus('Listing approved.', 'success');
                                    await renderMain();
                                } catch (error) {
                                    setStatus(error?.message || 'Unable to approve the listing.', 'error');
                                }
                            });
                        });

                        document.querySelectorAll('.reject-listing').forEach((button) => {
                            button.addEventListener('click', async () => {
                                try {
                                    await DawaDB.rejectMedicine(button.dataset.id);
                                    setStatus('Listing rejected.', 'success');
                                    await renderMain();
                                } catch (error) {
                                    setStatus(error?.message || 'Unable to reject the listing.', 'error');
                                }
                            });
                        });

                        document.querySelectorAll('.remove-listing').forEach((button) => {
                            button.addEventListener('click', async () => {
                                try {
                                    await DawaDB.removeMedicine(button.dataset.id);
                                    setStatus('Listing removed.', 'success');
                                    await renderMain();
                                } catch (error) {
                                    setStatus(error?.message || 'Unable to remove the listing.', 'error');
                                }
                            });
                        });
                    }

                    if (activeTab === 'requests') {
                        main.innerHTML = `
                        <div class="section-header">
                            <div>
                                <h1>Transfer Requests</h1>
                                <p class="small-note">Track all requests submitted from the home page.</p>
                            </div>
                        </div>
                        <div class="card">
                            <table class="wide-table">
                                <thead>
                                    <tr><th>Drug</th><th>Requesting facility</th><th>Delivery location</th><th>Contact</th><th>Details</th><th>Submitted</th><th>Status</th><th>Action</th></tr>
                                </thead>
                                <tbody>
                                    ${data.transferRequests
                                        .map((request) => {
                                            const contact = `<a href="tel:${request.phone}">${request.phone}</a><br><a href="mailto:${request.email}">${request.email}</a>`;
                                            const actions = request.status === 'resolved'
                                                ? '<span class="small-note">Resolved</span>'
                                                : `<button class="btn btn-primary contacted-request" data-id="${request.id}">Mark as contacted</button> <button class="btn btn-outline resolved-request" data-id="${request.id}">Mark as resolved</button>`;
                                            return `
                                                <tr>
                                                    <td>${request.drug}</td>
                                                    <td>${request.facility}</td>
                                                    <td>${request.deliveryLocation}</td>
                                                    <td>${contact}</td>
                                                    <td>${request.details || '-'}</td>
                                                    <td>${request.submittedAt ? new Date(request.submittedAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'}</td>
                                                    <td><span class="badge ${request.status === 'new' ? 'new' : request.status === 'contacted' ? 'contacted' : 'resolved'}">${request.status}</span></td>
                                                    <td>${actions}</td>
                                                </tr>
                                            `;
                                        })
                                        .join('')}
                                </tbody>
                            </table>
                        </div>
                        `;

                        document.querySelectorAll('.contacted-request').forEach((button) => {
                            button.addEventListener('click', async () => {
                                try {
                                    await DawaDB.updateTransferRequestStatus(button.dataset.id, 'contacted');
                                    setStatus('Request marked as contacted.', 'success');
                                    await renderMain();
                                } catch (error) {
                                    setStatus(error?.message || 'Unable to update the request.', 'error');
                                }
                            });
                        });

                        document.querySelectorAll('.resolved-request').forEach((button) => {
                            button.addEventListener('click', async () => {
                                try {
                                    await DawaDB.updateTransferRequestStatus(button.dataset.id, 'resolved');
                                    setStatus('Request marked as resolved.', 'success');
                                    await renderMain();
                                } catch (error) {
                                    setStatus(error?.message || 'Unable to update the request.', 'error');
                                }
                            });
                        });
                    }
                } catch (error) {
                    setStatus(error?.message || 'Unable to load the dashboard.', 'error');
                    main.innerHTML = `
                        <div class="section-header">
                            <div>
                                <h1>Dashboard unavailable</h1>
                                <p class="small-note">The dashboard could not load its data. Please sign in again or check the Supabase configuration.</p>
                            </div>
                        </div>
                    `;
                }
            }

            document.getElementById('logoutButton').addEventListener('click', async () => {
                try {
                    await DawaDB.signOutAdmin();
                } catch (error) {
                    // Ignore sign-out errors and redirect anyway so the user can return to the login screen.
                }
                window.location.href = 'admin-login.html';
            });

            const session = await DawaDB.getAdminSession();
            if (!session) {
                window.location.href = 'admin-login.html';
                return;
            }

            renderMain();
        })();
    </script>
</body>

</html>
