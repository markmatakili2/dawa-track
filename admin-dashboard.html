<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin dashboard | Dawa Track</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.56.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="db.js"></script>
  <style>
    .admin-topbar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .admin-title {
      margin: 0;
      font-size: 22px;
    }

    .admin-shell {
      max-width: 1120px;
      min-height: 56vh;
      margin: 0 auto;
      padding: 0 24px 32px;
      display: flex;
      gap: 20px;
    }

    .admin-sidebar {
      width: 220px;
      flex: 0 0 220px;
      padding: 8px 0;
      border-right: 1px solid var(--line);
      background: var(--surface);
    }

    .admin-nav-item {
      width: 100%;
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-left: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-weight: 600;
      cursor: pointer;
    }

    .admin-nav-item.active {
      border-left-color: var(--primary);
      background: var(--primary-tint);
      color: var(--primary-dark);
    }

    .admin-main {
      min-width: 0;
      flex: 1;
      padding: 20px 0;
    }

    .admin-main .section-header {
      margin-bottom: 16px;
    }

    .admin-metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .admin-metrics .metric-card {
      min-width: 0;
    }

    .admin-status {
      max-width: 1072px;
      margin: 0 auto;
      padding: 8px 24px;
    }

    .admin-status:not([hidden]) {
      margin-top: 8px;
    }

    .admin-table-wrap {
      max-width: 100%;
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
    }

    .admin-table th,
    .admin-table td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .admin-table th {
      background: var(--bg);
      color: var(--table-header);
      font-size: 12px;
      text-transform: uppercase;
    }

    .verification-note {
      min-width: 180px;
      min-height: 72px;
      margin-bottom: 8px;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 220px;
    }

    .admin-form {
      max-width: 720px;
      margin-top: 16px;
    }

    .admin-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .admin-form-grid .grid-full {
      grid-column: 1 / -1;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    @media (max-width: 900px) {
      .admin-shell {
        flex-direction: column;
      }

      .admin-sidebar {
        display: flex;
        width: 100%;
        flex: 0 0 auto;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .admin-nav-item {
        width: auto;
        flex: 0 0 auto;
      }

      .admin-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .admin-topbar,
      .admin-shell {
        padding-right: 16px;
        padding-left: 16px;
      }

      .admin-topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-main {
        padding-top: 12px;
      }

      .admin-metrics,
      .admin-form-grid {
        grid-template-columns: 1fr;
      }

      .admin-form-grid .grid-full {
        grid-column: auto;
      }

      .admin-actions {
        flex-direction: column;
      }

      .admin-actions .btn {
        width: 100%;
      }

      .admin-status {
        padding-right: 16px;
        padding-left: 16px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo"><span class="dot"></span>Dawa Track</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="login.html" data-nav-login>Login</a>
        <a class="active" href="admin-dashboard.html" data-nav-dashboard hidden>Dashboard</a>
        <button type="button" class="btn btn-outline" data-nav-logout hidden>Log out</button>
      </div>
      <span class="small-note" data-nav-status role="status" hidden></span>
    </nav>
  </header>

  <div class="admin-topbar">
    <div>
      <h1 class="admin-title">Admin dashboard</h1>
      <p class="small-note">Verify facilities, approve listings and manage transfer requests.</p>
    </div>
  </div>
  <div id="adminStatus" class="admin-status notice" role="status" aria-live="polite" hidden></div>
  <div class="admin-shell">
    <aside id="adminSidebar" class="admin-sidebar" aria-label="Admin sections"></aside>
    <main id="adminMain" class="admin-main"></main>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <strong>Dawa Track</strong>
        <p>Helping facilities move medicine before it becomes waste.</p>
      </div>
      <div>
        <a href="index.html">Home</a><br />
        <a href="about.html">About</a><br />
        <a href="login.html">Facility login</a><br />
        <a href="admin-login.html">Admin</a>
      </div>
    </div>
  </footer>

  <script>
    const adminMain = document.getElementById('adminMain');
    const adminSidebar = document.getElementById('adminSidebar');
    const adminStatus = document.getElementById('adminStatus');
    const adminTabs = [
      { id: 'overview', label: 'Overview' },
      { id: 'verification', label: 'Facility verification' },
      { id: 'medicine', label: 'Medicine Listings' },
      { id: 'requests', label: 'Transfer Requests' },
    ];
    let activeTab = 'overview';
    let verificationFilter = 'pending';
    let facilityProfiles = [];

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined && text !== null) node.textContent = String(text);
      if (className) node.className = className;
      return node;
    }

    function setStatus(message, tone) {
      adminStatus.textContent = message || '';
      adminStatus.className = `admin-status notice ${tone === 'error' ? 'notice-error' : 'notice-success'}`;
      adminStatus.hidden = !message;
    }

    function makeTable(headers) {
      const wrapper = element('div', null, 'admin-table-wrap');
      const table = element('table', null, 'admin-table');
      const head = document.createElement('thead');
      const row = document.createElement('tr');
      headers.forEach((header) => row.append(element('th', header)));
      head.append(row);
      table.append(head);
      const body = document.createElement('tbody');
      table.append(body);
      wrapper.append(table);
      return { wrapper, body };
    }

    function badge(status) {
      const style = {
        pending: 'amber',
        approved: 'green',
        rejected: 'red',
        suspended: 'red',
        new: 'amber',
        contacted: 'teal',
        resolved: 'green',
      }[status] || 'gray';
      return element('span', status[0].toUpperCase() + status.slice(1), `badge ${style}`);
    }

    function appendCell(row, text) {
      row.append(element('td', text || '—'));
    }

    function renderSidebar() {
      adminSidebar.replaceChildren();
      adminTabs.forEach((tab) => {
        const button = element('button', tab.label, `admin-nav-item${tab.id === activeTab ? ' active' : ''}`);
        button.type = 'button';
        button.setAttribute('aria-current', tab.id === activeTab ? 'page' : 'false');
        button.addEventListener('click', () => {
          activeTab = tab.id;
          renderMain();
        });
        adminSidebar.append(button);
      });
    }

    async function renderOverview() {
      adminMain.replaceChildren(
        element('div', null, 'section-header'),
      );
      const header = adminMain.firstChild;
      header.append(element('h2', 'Overview'));
      const note = element('p', 'Live counts from the connected Supabase database.', 'small-note');
      header.append(note);
      const counts = await DawaDB.getAdminCounts();
      const metrics = [
        ['Verified facilities', counts.verifiedFacilities],
        ['Pending verifications', counts.pendingVerifications],
        ['Approved listings', counts.approvedListings],
        ['Pending listings', counts.pendingListings],
        ['Open transfer requests', counts.openRequests],
      ];
      const grid = element('div', null, 'admin-metrics');
      metrics.forEach(([label, value]) => {
        const card = element('article', null, 'metric-card');
        card.append(element('div', label, 'metric-label'), element('div', value, 'metric-value'));
        grid.append(card);
      });
      adminMain.append(grid);
    }

    function verificationActions(profile, row, notes) {
      const actions = element('div', null, 'row-actions');
      const addAction = (label, status, needsNote = false) => {
        const button = element('button', label, status === 'approved' ? 'btn btn-primary' : 'btn btn-outline');
        button.type = 'button';
        button.addEventListener('click', async () => {
          const note = notes.value.trim();
          if (needsNote && !note) {
            setStatus(`Add a note before you ${status} this facility.`, 'error');
            notes.focus();
            return;
          }
          button.disabled = true;
          try {
            await DawaDB.setFacilityVerification(profile.userId, status, note);
            facilityProfiles = await DawaDB.getFacilityProfiles('all');
            setStatus(`Facility ${status === 'approved' ? 'approved' : status === 'pending' ? 'reactivated' : status}.`, 'success');
            await renderVerification();
          } catch (error) {
            setStatus(error.message || 'Unable to update facility verification.', 'error');
            button.disabled = false;
          }
        });
        actions.append(button);
      };

      if (profile.verificationStatus !== 'approved') addAction(profile.verificationStatus === 'pending' ? 'Approve' : 'Reactivate', 'approved');
      if (profile.verificationStatus !== 'rejected') addAction('Reject', 'rejected', true);
      if (profile.verificationStatus !== 'suspended') addAction('Suspend', 'suspended', true);
      row.append(actions);
    }

    async function renderVerification() {
      adminMain.replaceChildren();
      const header = element('div', null, 'section-header');
      header.append(element('h2', 'Facility verification'));
      header.append(element('p', 'Review submitted facility details and manage account access.', 'small-note'));
      adminMain.append(header);
      facilityProfiles = await DawaDB.getFacilityProfiles('all');

      const filters = element('div', null, 'filter-chips');
      const counts = Object.fromEntries(['pending', 'approved', 'rejected', 'suspended'].map((status) => [
        status,
        facilityProfiles.filter((profile) => profile.verificationStatus === status).length,
      ]));
      const options = [
        ['pending', `Pending (${counts.pending})`],
        ['approved', `Approved (${counts.approved})`],
        ['rejected', `Rejected (${counts.rejected})`],
        ['suspended', `Suspended (${counts.suspended})`],
        ['all', `All (${facilityProfiles.length})`],
      ];
      options.forEach(([value, label]) => {
        const button = element('button', label, `btn btn-outline${verificationFilter === value ? ' active' : ''}`);
        button.type = 'button';
        button.setAttribute('aria-pressed', String(verificationFilter === value));
        button.addEventListener('click', () => {
          verificationFilter = value;
          renderVerification().catch((error) => setStatus(error.message || 'Unable to load facility profiles.', 'error'));
        });
        filters.append(button);
      });
      adminMain.append(filters);

      const profiles = verificationFilter === 'all'
        ? facilityProfiles
        : facilityProfiles.filter((profile) => profile.verificationStatus === verificationFilter);
      const table = makeTable(['Facility', 'Type', 'County', 'Licence number', 'Contact person', 'Role', 'Phone', 'Email', 'Registered', 'Status', 'Review actions']);
      profiles.forEach((profile) => {
        const row = document.createElement('tr');
        appendCell(row, profile.facilityName);
        appendCell(row, profile.facilityType.replaceAll('_', ' '));
        appendCell(row, profile.county);
        appendCell(row, profile.licenceNumber);
        appendCell(row, profile.contactPerson);
        appendCell(row, profile.contactRole);
        const phoneCell = document.createElement('td');
        if (profile.phone) {
          const phone = element('a', profile.phone);
          phone.href = `tel:${profile.phone}`;
          phoneCell.append(phone);
        } else phoneCell.textContent = '—';
        row.append(phoneCell);
        const emailCell = document.createElement('td');
        if (profile.email) {
          const email = element('a', profile.email);
          email.href = `mailto:${profile.email}`;
          emailCell.append(email);
        } else emailCell.textContent = '—';
        row.append(emailCell);
        appendCell(row, profile.createdAt ? new Date(profile.createdAt).toLocaleDateString('en-GB') : '—');
        const statusCell = document.createElement('td');
        statusCell.append(badge(profile.verificationStatus));
        row.append(statusCell);
        const actionCell = document.createElement('td');
        const notes = element('textarea', null, 'verification-note');
        notes.placeholder = 'Required for rejection or suspension';
        notes.setAttribute('aria-label', `Review notes for ${profile.facilityName}`);
        verificationActions(profile, actionCell, notes);
        const actions = actionCell.querySelector('.row-actions');
        actionCell.insertBefore(notes, actions);
        row.append(actionCell);
        table.body.append(row);
      });
      if (!profiles.length) {
        const row = document.createElement('tr');
        const cell = element('td', 'No facilities match this filter.', 'empty-state');
        cell.colSpan = 11;
        row.append(cell);
        table.body.append(row);
      }
      adminMain.append(table.wrapper);
    }

    function renderMedicineForm() {
      const card = element('section', null, 'card admin-form');
      card.append(element('h3', 'Add approved listing'));
      const form = element('form', null, 'admin-form-grid');
      const fields = [
        ['Medicine name *', 'drug', 'text'],
        ['Quantity *', 'quantity', 'number'],
        ['Unit', 'unit', 'text'],
        ['Facility name *', 'facility', 'text'],
        ['Expiry date *', 'expiry', 'date'],
      ];
      fields.forEach(([fieldLabel, name, type]) => {
        const label = element('label', fieldLabel);
        const input = element('input');
        input.name = name;
        input.type = type;
        input.required = fieldLabel.includes('*');
        if (name === 'quantity') input.min = '1';
        if (name === 'unit') input.value = 'units';
        label.append(input);
        form.append(label);
      });
      const statusLabel = element('label', 'Stock status');
      const status = element('select');
      status.name = 'status';
      [['ready', 'Ready'], ['monitor', 'Monitor']].forEach(([value, label]) => {
        const option = element('option', label);
        option.value = value;
        status.append(option);
      });
      statusLabel.append(status);
      form.append(statusLabel);
      const actions = element('div', null, 'admin-actions grid-full');
      const button = element('button', 'Add listing', 'btn btn-primary');
      button.type = 'submit';
      actions.append(button);
      form.append(actions);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        try {
          await DawaDB.adminAddMedicine(Object.fromEntries(new FormData(form).entries()));
          setStatus('Listing added.', 'success');
          await renderMain();
        } catch (error) {
          setStatus(error.message || 'Unable to add the listing.', 'error');
          button.disabled = false;
        }
      });
      card.append(form);
      return card;
    }

    async function renderMedicines() {
      adminMain.replaceChildren();
      const header = element('div', null, 'section-header');
      header.append(element('h2', 'Medicine Listings'));
      header.append(element('p', 'Approve pending stock and manage active listings.', 'small-note'));
      adminMain.append(header);
      const medicines = await DawaDB.getAllMedicines();
      const table = makeTable(['Medicine', 'Quantity', 'Facility / listed by', 'Expiry', 'Status', 'Action']);
      medicines.forEach((item) => {
        const row = document.createElement('tr');
        appendCell(row, item.drug);
        appendCell(row, item.quantityLabel);
        appendCell(row, item.facility);
        appendCell(row, item.expiry);
        const statusCell = document.createElement('td');
        statusCell.append(badge(item.approval));
        row.append(statusCell);
        const actionCell = document.createElement('td');
        const actions = element('div', null, 'row-actions');
        const addButton = (label, className, action) => {
          const button = element('button', label, className);
          button.type = 'button';
          button.addEventListener('click', async () => {
            button.disabled = true;
            try {
              await action();
              setStatus(`Listing ${label.toLowerCase()}.`, 'success');
              await renderMain();
            } catch (error) {
              setStatus(error.message || 'Unable to update the listing.', 'error');
              button.disabled = false;
            }
          });
          actions.append(button);
        };
        if (item.approval === 'pending') {
          addButton('Approve', 'btn btn-primary', () => DawaDB.approveMedicine(item.id));
          addButton('Reject', 'btn btn-outline', () => DawaDB.rejectMedicine(item.id));
        } else {
          addButton('Remove', 'btn btn-outline', () => DawaDB.removeMedicine(item.id));
        }
        actionCell.append(actions);
        row.append(actionCell);
        table.body.append(row);
      });
      if (!medicines.length) {
        const row = document.createElement('tr');
        const cell = element('td', 'No medicine listings are available.', 'empty-state');
        cell.colSpan = 6;
        row.append(cell);
        table.body.append(row);
      }
      const wrapper = element('section', null, 'card');
      wrapper.append(table.wrapper);
      adminMain.append(wrapper, renderMedicineForm());
    }

    async function renderRequests() {
      adminMain.replaceChildren();
      const header = element('div', null, 'section-header');
      header.append(element('h2', 'Transfer Requests'));
      header.append(element('p', 'Track requester and supplier facilities, contact details and status.', 'small-note'));
      adminMain.append(header);
      const requests = await DawaDB.getTransferRequests();
      const table = makeTable(['Medicine', 'Requester', 'Supplier', 'Delivery location', 'Contact', 'Details', 'Submitted', 'Status', 'Action']);
      requests.forEach((request) => {
        const row = document.createElement('tr');
        appendCell(row, request.drug);
        appendCell(row, request.facility);
        appendCell(row, request.supplierFacility);
        appendCell(row, request.deliveryLocation);
        const contact = document.createElement('td');
        const phone = element('a', request.phone);
        phone.href = `tel:${request.phone}`;
        const email = element('a', request.email);
        email.href = `mailto:${request.email}`;
        contact.append(phone, document.createElement('br'), email);
        row.append(contact);
        appendCell(row, request.details);
        appendCell(row, request.submittedAt ? new Date(request.submittedAt).toLocaleString('en-GB') : '—');
        const statusCell = document.createElement('td');
        statusCell.append(badge(request.status));
        row.append(statusCell);
        const actionCell = document.createElement('td');
        if (request.status === 'resolved') {
          actionCell.append(element('span', 'Resolved', 'small-note'));
        } else {
          const actions = element('div', null, 'row-actions');
          const addStatusButton = (label, status, className) => {
            const button = element('button', label, className);
            button.type = 'button';
            button.addEventListener('click', async () => {
              button.disabled = true;
              try {
                await DawaDB.updateTransferRequestStatus(request.id, status);
                setStatus(`Request marked ${status}.`, 'success');
                await renderMain();
              } catch (error) {
                setStatus(error.message || 'Unable to update the request.', 'error');
                button.disabled = false;
              }
            });
            actions.append(button);
          };
          if (request.status === 'new') addStatusButton('Mark contacted', 'contacted', 'btn btn-primary');
          addStatusButton('Mark resolved', 'resolved', 'btn btn-outline');
          actionCell.append(actions);
        }
        row.append(actionCell);
        table.body.append(row);
      });
      if (!requests.length) {
        const row = document.createElement('tr');
        const cell = element('td', 'No transfer requests have been submitted.', 'empty-state');
        cell.colSpan = 9;
        row.append(cell);
        table.body.append(row);
      }
      const card = element('section', null, 'card');
      card.append(table.wrapper);
      adminMain.append(card);
    }

    async function renderMain() {
      renderSidebar();
      setStatus('');
      try {
        if (activeTab === 'overview') await renderOverview();
        if (activeTab === 'verification') await renderVerification();
        if (activeTab === 'medicine') await renderMedicines();
        if (activeTab === 'requests') await renderRequests();
      } catch (error) {
        setStatus(error.message || 'Unable to load the admin dashboard.', 'error');
        adminMain.replaceChildren(element('h2', 'Dashboard unavailable'));
      }
    }

    async function initializeAdminDashboard() {
      try {
        const session = await DawaDB.getSession();
        if (!session) {
          window.location.replace('admin-login.html');
          return;
        }
        if (await DawaDB.getRole() !== 'admin') {
          window.location.replace('admin-login.html');
          return;
        }
        await renderMain();
      } catch (error) {
        setStatus(error.message || 'Unable to verify admin access.', 'error');
      }
    }

    DawaDB.initializeNavigation();
    initializeAdminDashboard();
  </script>
</body>

</html>
